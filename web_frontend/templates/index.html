<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoTrain 4.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .prompt-input {
            width: 100%;
            min-height: 120px;
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
            color: #1f2937;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .prompt-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .prompt-input::placeholder {
            color: #9ca3af;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            color: #ffffff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.45);
            opacity: 0.95;
        }

        .btn-secondary {
            color: #4b5563;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e5e7eb;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .output-panel {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            overflow: hidden;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .output-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .status-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: #e5e7eb;
            color: #6b7280;
        }

        .status-badge.running {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-badge.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .output-content {
            height: 320px;
            overflow-y: auto;
            padding: 16px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #1f2937;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .output-content:empty::before {
            content: "等待启动...";
            color: #9ca3af;
        }

        .log-line {
            margin-bottom: 4px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AutoTrain 4.0</h1>
            <p>用自然语言描述训练需求，一键启动 DLCV AI 训练平台</p>
        </div>

        <div class="input-group">
            <label class="input-label" for="prompt">训练需求</label>
            <textarea
                id="prompt"
                class="prompt-input"
                placeholder="例如：训练一个 cls 模型来辨别王不留行和白芷"
            ></textarea>
        </div>

        <div class="button-group">
            <button id="startBtn" class="btn btn-primary">开始训练</button>
            <button id="clearBtn" class="btn btn-secondary">清空日志</button>
        </div>

        <div class="output-panel">
            <div class="output-header">
                <span class="output-title">运行日志</span>
                <span id="statusBadge" class="status-badge">就绪</span>
            </div>
            <div id="output" class="output-content"></div>
        </div>

        <div class="footer">
            后台调用 auto_train4.0.py --prompt "..." 执行训练
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('prompt');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const output = document.getElementById('output');
        const statusBadge = document.getElementById('statusBadge');

        let eventSource = null;

        function setStatus(status, text) {
            statusBadge.className = 'status-badge ' + status;
            statusBadge.textContent = text;
        }

        function appendLine(text) {
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            output.innerHTML = '';
            setStatus('', '就绪');
        }

        function startRun() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                alert('请输入训练需求');
                return;
            }

            if (eventSource) {
                eventSource.close();
            }

            clearOutput();
            setStatus('running', '运行中');
            startBtn.disabled = true;
            appendLine(`[开始] 提示词: ${prompt}`);

            const encodedPrompt = encodeURIComponent(prompt);
            eventSource = new EventSource(`/run?prompt=${encodedPrompt}`);

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'log') {
                        appendLine(data.line);
                    } else if (data.type === 'error') {
                        appendLine(`[错误] ${data.message}`);
                        setStatus('error', '出错');
                    } else if (data.type === 'done') {
                        if (data.code === 0) {
                            appendLine(`[完成] 训练成功，耗时 ${data.elapsed} 秒`);
                            setStatus('success', '成功');
                        } else {
                            appendLine(`[完成] 进程退出码: ${data.code}，耗时 ${data.elapsed} 秒`);
                            setStatus('error', '失败');
                        }
                        eventSource.close();
                        startBtn.disabled = false;
                    }
                } catch (err) {
                    appendLine(event.data);
                }
            };

            eventSource.onerror = (err) => {
                appendLine('[错误] 连接中断');
                setStatus('error', '中断');
                startBtn.disabled = false;
                eventSource.close();
            };
        }

        startBtn.addEventListener('click', startRun);
        clearBtn.addEventListener('click', clearOutput);

        promptInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                startRun();
            }
        });
    </script>
</body>
</html>
